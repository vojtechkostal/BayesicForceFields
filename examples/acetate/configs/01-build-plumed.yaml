project:
  directory: ./

gromacs:
  command: gmx

systems:
  - system_id: acetate
    system_name: Aqueous acetate
    topology: ../inputs/common/topol.top
    templates:
      ACE: ../inputs/common/ace.gro
    mdp:
      em: ../inputs/common/mdp/em.mdp
      npt: ../inputs/common/mdp/npt.mdp
      prod: ../inputs/common/mdp/nvt.mdp
    charge: -1
    multiplicity: 1
    nsteps:
      npt: 0
      prod: 100000
    box: [15.7107, 15.7107, 15.7107, 90, 90, 90]

  - system_id: acetate-contact
    system_name: Acetate-calcium contact pair
    topology: ../inputs/common/topol-ions.top
    templates:
      ACE: ../inputs/common/ace.gro
    mdp:
      em: ../inputs/common/mdp/em.mdp
      npt: ../inputs/common/mdp/npt.mdp
      prod: ../inputs/common/mdp/nvt.mdp
    charge: 1
    multiplicity: 1
    nsteps:
      npt: 0
      prod: 100000
    box: [15.7480, 15.7480, 15.7480, 90, 90, 90]
    bias:
      plumed_file: ../inputs/biases/plumed-001.dat

  - system_id: acetate-separated
    system_name: Acetate-calcium separated pair
    topology: ../inputs/common/topol-ions.top
    templates:
      ACE: ../inputs/common/ace.gro
    mdp:
      em: ../inputs/common/mdp/em.mdp
      npt: ../inputs/common/mdp/npt.mdp
      prod: ../inputs/common/mdp/nvt.mdp
    charge: 1
    multiplicity: 1
    nsteps:
      npt: 0
      prod: 100000
    box: [15.7480, 15.7480, 15.7480, 90, 90, 90]
    bias:
      plumed_file: ../inputs/biases/plumed-002.dat
