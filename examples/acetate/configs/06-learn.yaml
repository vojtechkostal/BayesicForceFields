specs: ../03-sample/specs.yaml
models:
  rdf:
    model_path: ../05-lgp/models/rdf.lgp
    tolerance: 0.1
  hb:
    model_path: ../05-lgp/models/hb.lgp
    independent_observations: true
  contact-distance:
    model_path: ../05-lgp/models/contact-distance.lgp
    tolerance: 0.01
  separated-distance:
    model_path: ../05-lgp/models/separated-distance.lgp
    tolerance: 0.01
mcmc:
  priors_disttype: normal
  total_steps: 10000
  warmup: 2000
  progress_stride: 1000
  resume: false
  device: cuda
  rhat_tol: 1.05
plots:
  max_corner_samples: 2000
  max_marginal_samples: 10000
  max_qoi_samples: 10000
  qoi_batch_size: 256
  plot_metadata:
    define VSA:
      xlabel: O-VS
      ylabel: angle [degree]
    define VSD:
      xlabel: C-O-VS
      ylabel: distance [nm]
output:
  directory: ./
  overwrite: false
