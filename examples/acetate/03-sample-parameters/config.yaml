# Draw acetate charge sets and run, for each, MD of both systems.
# Runs locally. For Slurm, set job_scheduler: slurm and uncomment the block at
# the end.
campaign_dir: ./
source: ../01-build
gmx_cmd: gmx  # ADAPT: for example "srun gmx_mpi" on a Slurm cluster
job_scheduler: local

systems:  # ADAPT: simulation lengths (dt = 2 fs); shorten them for a smoke test
  - {system_id: acetate, n_steps: 1000000}  # 2 ns
  - {system_id: calcium-acetate, n_steps: 5000000}  # 10 ns, writes production.pmf

n_samples: 100  # ADAPT
bounds:
  charge C1: [-1.0, 0.3]
  charge C2: [0.0, 1.0]
  charge H1 H2 H3: [-0.3, 0.3]
  charge O1 O2: [-0.8, -0.3]
# Every acetate keeps the total charge -0.8; C2 is solved from the others.
charge_constraints:
  - selection: resname ACE
    target: -0.8
    scope: residue
    implicit: C2

store: [xtc, pmf]  # keep the trajectory and the Colvars PMF of every sample
cleanup: true  # delete everything else once a system has finished

